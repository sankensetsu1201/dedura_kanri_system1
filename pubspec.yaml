name: demen_app
description: 出面管理アプリ
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase / Firestore / Auth
  firebase_core: ^2.25.4
  cloud_firestore: ^4.15.8
  firebase_auth: ^4.17.4

  # 生体認証
  local_auth: ^2.1.7

  # ローカル保存
  shared_preferences: ^2.2.3

  # CSV
  path_provider: ^2.1.2
  csv: ^5.0.0
  pdf: ^3.10.4
  printing: ^5.10.4

  # 日付ロケール等
  intl: 0.20.2

  # Flutter のローカライズサポート（必須）
  flutter_localizations:
    sdk: flutter
  excel: ^2.1.0
  flutter_svg: ^2.0.7



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo.png

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-VariableFont_wght.ttf
